<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ডট গেম (Dots & Boxes) - অনলাইন মাল্টিপ্লেয়ার ও AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #020617 75%);
      color: #f8fafc;
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }
    .edge-hit {
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .edge-hit:hover .edge-preview {
      opacity: 0.55;
    }
    .edge-preview {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      75% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .box-pop {
      animation: popIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-box: fill-box;
      transform-origin: center;
    }
    input[type="range"] {
      accent-color: #a855f7;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-5">

  <!-- Top Header -->
  <header class="w-full max-w-3xl flex items-center justify-between gap-2 mb-3">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-yellow-400 flex items-center justify-center shadow-lg shadow-purple-500/20 font-extrabold text-slate-950 text-lg">
        •—•
      </div>
      <div>
        <h1 id="appTitle" class="text-lg sm:text-xl font-bold tracking-tight leading-tight text-white">ডট গেম (Dots &amp; Boxes)</h1>
        <p id="appSubtitle" class="text-xs text-slate-400">অনলাইন মাল্টিপ্লেয়ার ও কম্পিউটার AI</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" onclick="toggleSound()" class="glass px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-200 hover:bg-slate-800/80 transition flex items-center gap-1.5" title="Sound">
        <span id="soundIcon">🔊</span>
        <span id="soundLabel" class="hidden sm:inline">সাউন্ড</span>
      </button>
      <button id="langToggleBtn" onclick="toggleLanguage()" class="glass px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold text-purple-300 hover:bg-slate-800/80 transition">
        English
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-3xl flex-1 flex flex-col items-center justify-center my-auto">

    <!-- LOBBY SCREEN -->
    <section id="lobbyScreen" class="w-full max-w-md glass rounded-2xl p-5 sm:p-6 shadow-2xl">
      <!-- Name Input -->
      <div class="mb-4">
        <label id="lblPlayerName" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">আপনার নাম</label>
        <input id="playerNameInput" type="text" maxlength="16" placeholder="যেমন: সাকিব"
          class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition" />
      </div>

      <!-- Mode Tabs -->
      <div class="grid grid-cols-3 gap-1.5 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800/80 mb-5">
        <button id="tabCreate" onclick="switchTab('create')" class="py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-purple-600 text-white shadow">
          ➕ রুম তৈরি
        </button>
        <button id="tabJoin" onclick="switchTab('join')" class="py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white">
          🔗 রুম যোগদান
        </button>
        <button id="tabAi" onclick="switchTab('ai')" class="py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white">
          🤖 কম্পিউটার
        </button>
      </div>

      <!-- Grid Size Customizer (Shown on Create & AI tabs) -->
      <div id="gridSettingsPanel" class="bg-slate-900/65 border border-slate-800 rounded-xl p-4 mb-5">
        <div class="flex items-center justify-between mb-2">
          <span id="lblGridSize" class="text-xs font-semibold uppercase tracking-wider text-slate-300">বোর্ডের ঘর সংখ্যা (বক্স)</span>
          <span id="gridBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">৪ × ৪ বক্স</span>
        </div>

        <!-- Presets -->
        <div class="grid grid-cols-4 gap-1.5 mb-3">
          <button type="button" onclick="setPresetGrid(3,3)" class="preset-btn py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/70 transition">৩×৩</button>
          <button type="button" onclick="setPresetGrid(4,4)" class="preset-btn py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/70 transition">৪×৪</button>
          <button type="button" onclick="setPresetGrid(5,5)" class="preset-btn py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/70 transition">৫×৫</button>
          <button type="button" onclick="setPresetGrid(7,7)" class="preset-btn py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/70 transition">৭×৭</button>
        </div>

        <!-- Custom Sliders -->
        <div class="space-y-2.5">
          <div>
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span id="lblRows">সারি (Rows)</span>
              <span id="rowsVal" class="font-bold text-slate-200">4</span>
            </div>
            <input id="rowsSlider" type="range" min="2" max="10" value="4" oninput="updateGridFromSliders()" class="w-full h-1.5 bg-slate-700 rounded-lg cursor-pointer" />
          </div>
          <div>
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span id="lblCols">কলাম (Columns)</span>
              <span id="colsVal" class="font-bold text-slate-200">4</span>
            </div>
            <input id="colsSlider" type="range" min="2" max="10" value="4" oninput="updateGridFromSliders()" class="w-full h-1.5 bg-slate-700 rounded-lg cursor-pointer" />
          </div>
        </div>
      </div>

      <!-- TAB 1: CREATE ROOM -->
      <div id="panelCreate">
        <button id="createRoomBtn" onclick="createOnlineRoom()" class="w-full py-3 rounded-xl font-bold text-sm sm:text-base bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white shadow-lg shadow-purple-500/25 transition active:scale-[0.99]">
          নতুন রুম তৈরি করুন
        </button>
        <p id="createHint" class="text-[11px] text-slate-400 text-center mt-2.5">
          রুম তৈরি করে ৫-সংখ্যার কোডটি আপনার বন্ধুকে দিন, তিনি অন্য ডিভাইস থেকে যুক্ত হতে পারবেন।
        </p>
      </div>

      <!-- TAB 2: JOIN ROOM -->
      <div id="panelJoin" class="hidden">
        <label id="lblRoomCode" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">৫-সংখ্যার রুম কোড</label>
        <input id="roomCodeInput" type="text" maxlength="5" inputmode="numeric" placeholder="যেমন: 48291"
          class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-center text-xl font-extrabold tracking-[0.35em] text-purple-300 placeholder-slate-600 focus:outline-none focus:border-purple-500 mb-4" />
        <button id="joinRoomBtn" onclick="joinOnlineRoom()" class="w-full py-3 rounded-xl font-bold text-sm sm:text-base bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg shadow-emerald-500/25 transition active:scale-[0.99]">
          রুমে যোগ দিন
        </button>
      </div>

      <!-- TAB 3: PLAY VS AI -->
      <div id="panelAi" class="hidden">
        <label id="lblAiLevel" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">কম্পিউটারের বুদ্ধিমত্তা (AI Level)</label>
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button type="button" onclick="selectAiLevel('easy')" id="aiEasyBtn" class="ai-lvl-btn py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-300 transition">
            সহজ (Easy)
          </button>
          <button type="button" onclick="selectAiLevel('medium')" id="aiMediumBtn" class="ai-lvl-btn py-2 rounded-xl text-xs font-bold border border-yellow-400 bg-yellow-400/20 text-yellow-300 transition">
            মাঝারি (Medium)
          </button>
          <button type="button" onclick="selectAiLevel('hard')" id="aiHardBtn" class="ai-lvl-btn py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-300 transition">
            কঠিন (Hard)
          </button>
        </div>
        <button id="startAiBtn" onclick="startAiGame()" class="w-full py-3 rounded-xl font-bold text-sm sm:text-base bg-gradient-to-r from-purple-600 to-yellow-500 hover:from-purple-500 hover:to-yellow-400 text-white shadow-lg shadow-purple-500/25 transition active:scale-[0.99]">
          কম্পিউটারের সাথে খেলা শুরু করুন
        </button>
      </div>

      <!-- Status / Error Message -->
      <div id="lobbyStatus" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center bg-rose-500/15 border border-rose-500/30 text-rose-300"></div>
    </section>

    <!-- GAME SCREEN -->
    <section id="gameScreen" class="hidden w-full flex flex-col items-center">

      <!-- Room Info Bar (Only for Online Mode) -->
      <div id="onlineRoomBar" class="hidden w-full max-w-xl glass rounded-xl px-3.5 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span id="lblRoomTag" class="text-xs text-slate-400">রুম কোড:</span>
          <span id="displayRoomCode" class="font-mono font-extrabold text-base sm:text-lg tracking-widest text-yellow-300 bg-slate-900 px-2.5 py-0.5 rounded-lg border border-slate-700">-----</span>
          <button onclick="copyRoomCode()" id="copyCodeBtn" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-purple-300 transition">
            কপি কোড
          </button>
          <button onclick="copyInviteLink()" id="copyLinkBtn" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-emerald-300 transition">
            লিংক শেয়ার
          </button>
        </div>
        <div id="connectionBadge" class="text-xs font-medium text-yellow-300 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
          <span id="connectionText">অন্য প্লেয়ারের জন্য অপেক্ষা করা হচ্ছে...</span>
        </div>
      </div>

      <!-- Scoreboard
